packages:
  - apps/*
  - packages/*

# Catalog: one version of shared tooling for every package.
# Packages reference these with "catalog:" instead of a version range.
catalog:
  typescript: ~5.9.3
  '@types/node': ^22.0.0
  eslint: ^9.0.0
  vitest: ^3.2.0
  zod: ^3.25.0

# pnpm 10 blocks dependency install scripts by default; allow only the ones we need.
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
