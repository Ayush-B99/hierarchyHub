# Short commands for everyday work. Run `task` to see them all.
# Install Task once: `brew install go-task` (macOS). Other options: https://taskfile.dev/installation
version: '3'

vars:
  WEB: '@hierarchy-hub/web'
  API: '@hierarchy-hub/api'
  SHARED: '@hierarchy-hub/shared'

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  # ---------- Setup ----------

  setup:
    desc: Install dependencies and create local .env files
    cmds:
      - corepack enable
      - pnpm install
      - task: env
      - task: db:migrate

  env:
    desc: Create local .env files from the examples (keeps existing ones)
    cmds:
      - cp -n apps/api/.env.example apps/api/.env || true
      - cp -n apps/web/.env.example apps/web/.env || true

  # ---------- Run ----------

  dev:
    desc: Start the frontend and backend together (needs the database, task db:up)
    aliases: [start, both]
    cmds:
      - pnpm dev

  web:
    desc: Start only the frontend (http://localhost:5173)
    aliases: [frontend, dev:web]
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.WEB}} dev

  web:mock:
    desc: Start only the frontend, using the mock API instead of the real one
    env:
      VITE_API_MOCKING: 'true'
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.WEB}} dev

  api:
    desc: Start only the backend (http://localhost:3000/api)
    aliases: [backend, dev:api]
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.API}} dev

  preview:
    desc: Build the frontend and serve the production version
    cmds:
      - pnpm turbo run build --filter={{.WEB}}
      - pnpm --filter {{.WEB}} preview

  # ---------- Tests ----------

  test:
    desc: Run every test (unit, then end-to-end)
    cmds:
      - task: unit
      - task: e2e

  unit:
    desc: Run all unit tests
    aliases: [test:unit]
    cmds:
      - pnpm test

  unit:web:
    desc: Run frontend tests only
    cmds:
      - pnpm turbo run test --filter={{.WEB}}

  unit:api:
    desc: Run backend unit tests only
    cmds:
      - pnpm turbo run test --filter={{.API}}

  unit:shared:
    desc: Run shared package tests only
    cmds:
      - pnpm --filter {{.SHARED}} test

  watch:
    desc: Re-run frontend tests on every change
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.WEB}} test:watch

  e2e:
    desc: Run end-to-end tests (boots the whole API against the test database)
    aliases: [test:e2e]
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:migrate:test
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.API}} test:e2e

  integration:
    desc: Run integration tests against the real test database
    aliases: [test:integration]
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:migrate:test
      - pnpm --filter {{.API}} test:integration

  # ---------- Database ----------

  db:up:
    desc: Start the local PostgreSQL in Docker (first start sets up users and databases)
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop the local database (your data is kept)
    cmds:
      - docker compose down

  db:reset:
    desc: Delete the local database completely and start fresh
    prompt: This deletes all local database data. Continue?
    cmds:
      - docker compose down -v
      - task: db:up
      - task: db:migrate

  db:migrate:
    desc: Apply migrations to the local and test databases
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:migrate
      - pnpm --filter {{.API}} db:migrate:test
      - pnpm --filter {{.API}} db:generate

  db:new-migration:
    desc: 'Create a migration after editing schema.prisma, eg: task db:new-migration -- add_department'
    cmds:
      - pnpm --filter {{.API}} db:new-migration --name {{.CLI_ARGS}}

  db:seed:
    desc: Load the sample employees into your local database (replaces what's there)
    prompt: This replaces all employees in your local database with sample data. Continue?
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:seed

  db:check:
    desc: Check schema.prisma still matches the real database (ci runs this too)
    cmds:
      - pnpm --filter {{.API}} db:check

  db:studio:
    desc: Browse the local data in Prisma Studio
    cmds:
      - pnpm --filter {{.API}} db:studio

  db:psql:
    desc: Open a SQL prompt on the local database, as the app user
    cmds:
      - docker compose exec postgres psql -U hh_app -d hierarchy_hub

  # ---------- Quality ----------

  lint:
    desc: Check code with ESLint
    cmds:
      - pnpm lint

  typecheck:
    desc: Check TypeScript types
    aliases: [types]
    cmds:
      - pnpm typecheck

  format:
    desc: Format every file with Prettier
    cmds:
      - pnpm format

  check:
    desc: Run everything CI runs (format, lint, types, tests, build)
    aliases: [ci]
    cmds:
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      - task: test
      - task: integration
      - pnpm build

  # ---------- Build and clean ----------

  admin:create:
    desc: 'Make an employee an admin who can sign in, eg task admin:create EMPLOYEE=EMP-0001'
    cmds:
      - pnpm --filter {{.API}} admin:create
    env:
      EMPLOYEE: '{{.EMPLOYEE}}'

  # ---------- AWS (adr 0021) ----------

  aws:bootstrap:
    desc: One time per account and region, prepares AWS for CDK deployments
    dir: infra
    cmds:
      - pnpm exec cdk bootstrap

  aws:deploy:
    desc: Build the web app and deploy everything to AWS
    cmds:
      - pnpm turbo run build --filter=@hierarchy-hub/web...
      - pnpm --filter @hierarchy-hub/infra deploy

  aws:setup:
    desc: One time after the first deploy, creates the database users and the database
    cmds:
      - pnpm --filter @hierarchy-hub/infra ops setup
      - pnpm --filter @hierarchy-hub/infra ops migrate

  aws:migrate:
    desc: Apply new migrations to the live database
    cmds:
      - pnpm --filter @hierarchy-hub/infra ops migrate

  aws:load-sample:
    desc: Load the sample people, accounts and history into an empty live database
    prompt: This loads sample data into the live database. It only works while that database is empty. Continue?
    cmds:
      - CONFIRM="load sample data" pnpm --filter @hierarchy-hub/infra ops load-sample

  aws:passwords:
    desc: Show the live sample accounts and their passwords
    cmds:
      - pnpm --filter @hierarchy-hub/infra ops passwords

  aws:destroy:
    desc: Delete everything on AWS, including the database
    prompt: This deletes the live site and its database for good. Continue?
    cmds:
      - pnpm --filter @hierarchy-hub/infra destroy

  # ---------- Docs site (adr 0015) ----------

  docs:setup:
    desc: Install MkDocs into .venv (needs Python 3)
    status:
      - test -x .venv/bin/mkdocs
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -r docs-site/requirements.txt

  docs:
    desc: Preview the docs site at http://localhost:8000, reloading as you edit
    deps: [docs:setup]
    cmds:
      - .venv/bin/mkdocs serve --dev-addr localhost:8000

  docs:build:
    desc: Build the docs site into site/ exactly as CI does (strict, so broken links fail)
    deps: [docs:setup]
    cmds:
      - .venv/bin/mkdocs build --strict

  build:
    desc: Build every package
    cmds:
      - pnpm build

  clean:
    desc: Remove build output, caches and node_modules
    cmds:
      - pnpm clean
