# Short commands for everyday work. Run `task` to see them all.
# Install Task once: `brew install go-task` (macOS). Other options: https://taskfile.dev/installation
version: '3'

vars:
  WEB: '@hierarchy-hub/web'
  API: '@hierarchy-hub/api'
  SHARED: '@hierarchy-hub/shared'

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  # ---------- Setup ----------

  setup:
    desc: Install dependencies and create local .env files
    cmds:
      - corepack enable
      - pnpm install
      - task: env
      - task: db:migrate

  env:
    desc: Create local .env files from the examples (keeps existing ones)
    cmds:
      - cp -n apps/api/.env.example apps/api/.env || true
      - cp -n apps/web/.env.example apps/web/.env || true

  # ---------- Run ----------

  dev:
    desc: Start the frontend and backend together (needs the database, task db:up)
    aliases: [start, both]
    cmds:
      - pnpm dev

  web:
    desc: Start only the frontend (http://localhost:5173)
    aliases: [frontend, dev:web]
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.WEB}} dev

  web:mock:
    desc: Start only the frontend, using the mock API instead of the real one
    env:
      VITE_API_MOCKING: 'true'
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.WEB}} dev

  api:
    desc: Start only the backend (http://localhost:3000/api)
    aliases: [backend, dev:api]
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.API}} dev

  preview:
    desc: Build the frontend and serve the production version
    cmds:
      - pnpm turbo run build --filter={{.WEB}}
      - pnpm --filter {{.WEB}} preview

  # ---------- Tests ----------

  test:
    desc: Run every test (unit, then end-to-end)
    cmds:
      - task: unit
      - task: e2e

  unit:
    desc: Run all unit tests
    aliases: [test:unit]
    cmds:
      - pnpm test

  unit:web:
    desc: Run frontend tests only
    cmds:
      - pnpm turbo run test --filter={{.WEB}}

  unit:api:
    desc: Run backend unit tests only
    cmds:
      - pnpm turbo run test --filter={{.API}}

  unit:shared:
    desc: Run shared package tests only
    cmds:
      - pnpm --filter {{.SHARED}} test

  watch:
    desc: Re-run frontend tests on every change
    cmds:
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.WEB}} test:watch

  e2e:
    desc: Run end-to-end tests (boots the whole API against the test database)
    aliases: [test:e2e]
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:migrate:test
      - pnpm turbo run build --filter={{.SHARED}}
      - pnpm --filter {{.API}} test:e2e

  integration:
    desc: Run integration tests against the real test database
    aliases: [test:integration]
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:migrate:test
      - pnpm --filter {{.API}} test:integration

  # ---------- Database ----------

  db:up:
    desc: Start the local PostgreSQL in Docker (first start sets up users and databases)
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop the local database (your data is kept)
    cmds:
      - docker compose down

  db:reset:
    desc: Delete the local database completely and start fresh
    prompt: This deletes all local database data. Continue?
    cmds:
      - docker compose down -v
      - task: db:up
      - task: db:migrate

  db:migrate:
    desc: Apply migrations to the local and test databases
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:migrate
      - pnpm --filter {{.API}} db:migrate:test

  db:new-migration:
    desc: 'Create a migration after editing schema.prisma, eg: task db:new-migration -- add_department'
    cmds:
      - pnpm --filter {{.API}} db:new-migration --name {{.CLI_ARGS}}

  db:seed:
    desc: Load the sample employees into your local database (replaces what's there)
    prompt: This replaces all employees in your local database with sample data. Continue?
    cmds:
      - task: db:up
      - pnpm --filter {{.API}} db:seed

  db:check:
    desc: Check schema.prisma still matches the real database (ci runs this too)
    cmds:
      - pnpm --filter {{.API}} db:check

  db:studio:
    desc: Browse the local data in Prisma Studio
    cmds:
      - pnpm --filter {{.API}} db:studio

  db:psql:
    desc: Open a SQL prompt on the local database, as the app user
    cmds:
      - docker compose exec postgres psql -U hh_app -d hierarchy_hub

  # ---------- Quality ----------

  lint:
    desc: Check code with ESLint
    cmds:
      - pnpm lint

  typecheck:
    desc: Check TypeScript types
    aliases: [types]
    cmds:
      - pnpm typecheck

  format:
    desc: Format every file with Prettier
    cmds:
      - pnpm format

  check:
    desc: Run everything CI runs (format, lint, types, tests, build)
    aliases: [ci]
    cmds:
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      - task: test
      - task: integration
      - pnpm build

  # ---------- Build and clean ----------

  build:
    desc: Build every package
    cmds:
      - pnpm build

  clean:
    desc: Remove build output, caches and node_modules
    cmds:
      - pnpm clean
