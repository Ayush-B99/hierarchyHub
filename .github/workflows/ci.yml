name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API end-to-end tests
        run: pnpm --filter @hierarchy-hub/api test:e2e

  database:
    name: Database migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # admin connection, only used to create the users and the test database below
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres_ci
      MIGRATOR_DATABASE_URL: postgresql://hh_migrator:migrator_ci@localhost:5432/hierarchy_hub_test?schema=public
      DATABASE_URL: postgresql://hh_app:app_ci@localhost:5432/hierarchy_hub_test?schema=public
      TEST_MIGRATOR_DATABASE_URL: postgresql://hh_migrator:migrator_ci@localhost:5432/hierarchy_hub_test?schema=public
      TEST_DATABASE_URL: postgresql://hh_app:app_ci@localhost:5432/hierarchy_hub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # same setup scripts as local docker and aws, so all three match
      - name: Create database users and the test database
        run: |
          psql -v ON_ERROR_STOP=1 -v migrator_password=migrator_ci -v app_password=app_ci -f apps/api/prisma/setup/roles.sql
          psql -v ON_ERROR_STOP=1 -c "create database hierarchy_hub_test owner hh_migrator"
          psql -v ON_ERROR_STOP=1 -d hierarchy_hub_test -v DBNAME=hierarchy_hub_test -f apps/api/prisma/setup/database.sql

      - name: Apply migrations
        run: pnpm --filter @hierarchy-hub/api db:migrate:test

      # fails if schema.prisma and the migrations have drifted apart
      - name: Check schema.prisma matches the database
        run: pnpm --filter @hierarchy-hub/api db:check

      - name: Integration tests
        run: pnpm --filter @hierarchy-hub/api test:integration
