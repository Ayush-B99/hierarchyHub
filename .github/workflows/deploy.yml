name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ steps.url.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Build the web app
        run: pnpm turbo run build --filter=@hierarchy-hub/web...

      - name: Deploy
        run: pnpm --filter @hierarchy-hub/infra run deploy

      - name: Apply new migrations
        run: pnpm --filter @hierarchy-hub/infra ops migrate

      - name: Site address
        id: url
        run: |
          url=$(aws cloudformation describe-stacks --stack-name HierarchyHub \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "site=$url" >> "$GITHUB_OUTPUT"
          echo "Live at $url" >> "$GITHUB_STEP_SUMMARY"
